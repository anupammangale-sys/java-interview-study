server.port=8099
spring.datasource.url=jdbc:h2:mem:ep12;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.demo=INFO
spring.jpa.open-in-view=false

# An unhandled exception makes Spring log the whole stack trace. That is worth
# knowing and it is not worth printing in a demo, so this one logger is off.
logging.level.org.apache.catalina.core.ContainerBase.[Tomcat].[localhost].[/]=OFF
